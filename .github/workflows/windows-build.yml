name: windows-build

# Proves Graphite still builds on Windows and produces an installer you can download
# from the run's "Artifacts". Not a release: nothing is published from here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # The local-summary helper is a separate program the installer bundles.
      - name: Build llama-helper (CPU)
        shell: bash
        run: |
          (cd llama-helper && cargo build --release)
          mkdir -p frontend/src-tauri/binaries
          cp target/release/llama-helper.exe frontend/src-tauri/binaries/llama-helper-x86_64-pc-windows-msvc.exe

      # ort-sys copies the ONNX Runtime DLLs next to the build output and into "examples"
      # and "deps" there; on a fresh runner those folders are missing and the copy panics.
      - name: Pre-create folders ort-sys copies into
        shell: bash
        run: mkdir -p target/release/examples target/release/deps target/release/build/examples target/release/build/deps

      - name: Install frontend packages
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build the installer
        working-directory: frontend
        shell: bash
        # The installer is finished before Tauri asks for an updater signing key we don't have;
        # the next step fails the run if no installer was produced.
        run: pnpm run tauri:build -- --bundles nsis || echo "(updater key error at the end is expected)"

      - name: Name the installer
        shell: bash
        run: |
          set -e
          mkdir -p dist
          f=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          [ -f "$f" ] || { echo "BUILD FAILED: no installer produced"; exit 1; }
          cp "$f" dist/Graphite-windows-x64-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Graphite-windows-x64-setup
          path: dist/Graphite-windows-x64-setup.exe

      # Keep the Windows beta download current: the "windows-beta" pre-release always holds
      # the installer from the newest build of main. (Mac users never see it: it is not "latest".)
      - name: Update the windows-beta download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload windows-beta dist/Graphite-windows-x64-setup.exe --clobber
